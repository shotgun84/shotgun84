<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Owais Imran</title>
  <desc id="d">A next-token prediction for the prompt "Owais Imran": trains small LLMs from scratch 0.46, builds agent pipelines 0.31, breaks systems 0.23.</desc>
  <style>
    .name  { font: 800 84px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -2.5px; fill: #f0f3f6; }
    .caret { fill: #ff8a4c; animation: blink 1.1s steps(1) infinite; }
    .label { font: 600 15px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2.5px; fill: #7d8590; }
    .tok   { font: 500 26px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #9198a1; }
    .prob  { font: 500 21px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #7d8590; text-anchor: end; }
    .top   { fill: #f0f3f6; }
    .ptop  { fill: #ff8a4c; }
    .rule  { stroke: #30363d; stroke-width: 1; }
    .track { fill: #21262d; }
    .bar   { fill: #484f58; transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) both; }
    .bar1  { fill: #ff8a4c; animation-delay: 0.15s; }
    .bar2  { animation-delay: 0.3s; }
    .bar3  { animation-delay: 0.45s; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .caret, .bar { animation: none; } }
  </style>

  <text class="name" x="24" y="104">Owais Imran<tspan class="caret" dx="6">_</tspan></text>

  <line class="rule" x1="24" y1="146" x2="936" y2="146"/>
  <text class="label" x="24" y="180">NEXT TOKEN</text>
  <text class="label" x="936" y="180" text-anchor="end">P</text>

  <text class="tok top" x="24" y="224">trains small LLMs from scratch</text>
  <rect class="track" x="560" y="209" width="290" height="12" rx="6"/>
  <rect class="bar bar1" x="560" y="209" width="290" height="12" rx="6"/>
  <text class="prob ptop" x="936" y="223">0.46</text>

  <text class="tok" x="24" y="268">builds agent pipelines</text>
  <rect class="track" x="560" y="253" width="290" height="12" rx="6"/>
  <rect class="bar bar2" x="560" y="253" width="195" height="12" rx="6"/>
  <text class="prob" x="936" y="267">0.31</text>

  <text class="tok" x="24" y="312">breaks systems</text>
  <rect class="track" x="560" y="297" width="290" height="12" rx="6"/>
  <rect class="bar bar3" x="560" y="297" width="145" height="12" rx="6"/>
  <text class="prob" x="936" y="311">0.23</text>
</svg>
